# Compute test coverage with covr and upload the report to Codecov.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'

name: test-coverage.yaml

permissions: read-all

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Don't let the project's renv autoloader run in CI (see the strip step).
      RENV_CONFIG_AUTO_LOAD: FALSE
      # Run the NOT_CRAN-gated integration fits so coverage measures the model
      # fit body of bs_expected(); without them bs_expected floors near 61% and
      # the package total sits around 88%. Unlike R-CMD-check, the coverage job
      # installs INLA (next step) precisely so these fits execute here.
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      # Strip the renv autoloader so it can't interfere with the CI library.
      - name: Disable renv in CI
        run: rm -f renv/activate.R .Rprofile
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard deps + non-INLA suggests. INLA is installed in the next step,
          # not through pak's resolver, so a flaky INLA repo can't stall the
          # whole dependency resolution.
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::xml2
            any::testthat
            any::ggplot2
            any::patchwork
            any::scales
            any::terra
            any::exactextractr

      # INLA is not on CRAN and its repo intermittently 415s, so install it on
      # its own with a few retries. Coverage is not a merge gate, so if INLA is
      # briefly unavailable this job fails and Codecov keeps its last value
      # rather than recording a misleadingly low number.
      - name: Install INLA for coverage
        run: |
          ok <- requireNamespace("INLA", quietly = TRUE)
          for (i in 1:3) {
            if (ok) break
            try(install.packages(
              "INLA",
              repos = c(
                INLA = "https://inla.r-inla-download.org/R/stable",
                getOption("repos")
              ),
              dependencies = TRUE
            ), silent = TRUE)
            ok <- requireNamespace("INLA", quietly = TRUE)
            if (!ok) Sys.sleep(20)
          }
          if (!ok) stop("INLA failed to install after 3 attempts")
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: truenomad/blindspot
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          # Codecov no longer allows tokenless uploads, so only treat an upload
          # error as a CI failure when a CODECOV_TOKEN is configured. Without the
          # token the upload is skipped rather than failing the whole job.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
