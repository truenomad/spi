# Compute test coverage with covr and upload the report to Codecov.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'

name: test-coverage.yaml

permissions: read-all

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Don't let the project's renv autoloader run in CI (see the strip step).
      RENV_CONFIG_AUTO_LOAD: FALSE

    steps:
      - uses: actions/checkout@v4

      # Strip the renv autoloader so it can't interfere with the CI library.
      - name: Disable renv in CI
        run: rm -f renv/activate.R .Rprofile
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard deps + non-INLA suggests. INLA is omitted so CI never contacts
          # its flaky repo; INLA-dependent tests skip via skip_if_not_installed.
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::xml2
            any::testthat
            any::ggplot2
            any::patchwork
            any::scales
            any::terra
            any::exactextractr

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: truenomad/blindspot
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          # Codecov no longer allows tokenless uploads, so only treat an upload
          # error as a CI failure when a CODECOV_TOKEN is configured. Without the
          # token the upload is skipped rather than failing the whole job.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
