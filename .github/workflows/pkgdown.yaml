# Build the pkgdown site and deploy it to GitHub Pages via GitHub Actions.
# Replaces the legacy "Deploy from a branch" (gh-pages) build: the site is
# uploaded as a Pages artifact and served as-is, so GitHub's Jekyll builder
# never runs. That removes the auto-generated "pages build and deployment"
# workflow, its deployment_queued stalls, and the "Page build failed" errors.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

# Serialise deployments and drop superseded ones so bursts of pushes don't
# stack up behind each other the way the legacy builder did.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Don't let the project's renv autoloader run in CI (see the strip step).
      RENV_CONFIG_AUTO_LOAD: FALSE
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Strip the renv autoloader so it can't interfere with the CI library.
      - name: Disable renv in CI
        run: rm -f renv/activate.R .Rprofile
        shell: bash

      # Enable Pages in "GitHub Actions" mode on the first run, migrating the
      # repo off the legacy branch build without a manual settings change.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: r-lib/actions/setup-pandoc@v2

      # Quarto is needed because the vignettes use the quarto engine.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard deps + non-INLA suggests. INLA is omitted so CI never contacts
          # its flaky repo; the reference examples that use it are \dontrun.
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            local::.
            any::ggplot2
            any::patchwork
            any::scales
            any::terra
            any::exactextractr
          needs: website

      # The INLA articles are knitted locally by vignettes/precompile.R and
      # committed as plain .Rmd. CI has no INLA, so fail if a knitted article
      # still has an R chunk, or if a .Rmd.orig changed since it was knitted.
      - name: Check articles are precomputed
        run: |
          if grep -l '^```{r' vignettes/*.Rmd; then
            echo "Knit the files above with vignettes/precompile.R and commit them."
            exit 1
          fi
          cd vignettes
          for f in *.Rmd.orig; do
            if ! grep -q "  $f\$" precompiled.md5; then
              echo "$f has not been knitted by precompile.R."
              exit 1
            fi
          done
          if ! md5sum --check --quiet precompiled.md5; then
            echo "An .Rmd.orig changed since it was knitted. Run vignettes/precompile.R and commit."
            exit 1
          fi
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown >= 2.2.0 writes llms.txt and a .md copy of every page so agents
      # can read the site. Fail the build if they are missing.
      - name: Check LLM docs
        run: |
          test -f docs/llms.txt
          test -f docs/index.md
          for a in spi-getting-started spi-methods spi-interpretation spi-field-guide spi-model-options; do
            test -f "docs/articles/$a.md"
            grep -q "articles/$a.md" docs/llms.txt
          done
        shell: bash

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
