# Run R CMD check on Linux (current R release) on every push and PR.
# A single release job -- this is a private, non-CRAN package, so the
# devel/oldrel matrix isn't worth the extra runs.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'

name: R-CMD-check.yaml

permissions: read-all

# Cancel an in-progress run when a newer commit lands on the same ref, so only
# the latest push is ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Don't let the project's renv autoloader run in CI (see the strip step).
      RENV_CONFIG_AUTO_LOAD: FALSE
      # INLA is a Suggests-level, non-CRAN dependency that is deliberately not
      # installed in CI -- its download server intermittently 415s and stalls
      # dependency resolution. INLA-dependent tests and examples skip; this flag
      # stops R CMD check erroring on the missing suggested package.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      # Strip the renv autoloader so it can't shadow the check library with the
      # project's renv cache (it otherwise fires on every Rscript invocation).
      - name: Disable renv in CI
        run: rm -f renv/activate.R .Rprofile
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard deps + the non-INLA suggests only. INLA is omitted on purpose so
          # CI never contacts the flaky INLA repo; its code paths skip instead.
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::ggplot2
            any::patchwork
            any::scales
            any::terra
            any::exactextractr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # No --as-cran: this is a private, non-CRAN package, and --as-cran's
          # CRAN-incoming-feasibility checks raise false-positive WARNINGs here
          # (INLA is a non-CRAN dependency; --as-cran would flag it).
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
