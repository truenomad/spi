url: https://truenomad.github.io/spi/

# Write llms.txt and a .md copy of every page so agents can read the site
# (pkgdown >= 2.2.0). This is the default; set here so it is not dropped.
llm-docs: true

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  math-rendering: mathml
  includes:
    in_header: |
      <script>
        (function() {
          // light between 06:00 and 18:00 local time, dark otherwise
          var hour = new Date().getHours();
          var timeOfDay = (hour >= 6 && hour < 18) ? 'light' : 'dark';
          var ls;
          try { ls = window.localStorage; } catch (e) { ls = null; }
          var userSet = ls && ls.getItem('pkgdown-theme-source') === 'user';
          var stored = ls && ls.getItem('pkgdown-theme');
          var theme = (userSet && stored) ? stored : timeOfDay;
          if (ls && !userSet) ls.setItem('pkgdown-theme', timeOfDay);
          document.documentElement.dataset.bsTheme = theme;
          // any later change to data-bs-theme (via pkgdown's lightswitch)
          // is an explicit user choice, so remember it for next visit
          new MutationObserver(function() {
            var current = document.documentElement.dataset.bsTheme;
            if (!current || !ls) return;
            ls.setItem('pkgdown-theme', current);
            ls.setItem('pkgdown-theme-source', 'user');
          }).observe(document.documentElement, {
            attributes: true, attributeFilter: ['data-bs-theme']
          });
        })();
      </script>
  bslib:
    # palette drawn from the spi logo: charcoal strokes, white ground, teal
    # accents in the wave and the red dot on the i. Links use a darker teal
    # so they reach 4.5:1 contrast on the white ground.
    primary: "#2C2C2A"
    secondary: "#444441"
    success: "#5BA86F"
    info: "#398A9D"
    warning: "#F2A900"
    danger: "#CC1111"
    body-bg: "#FFFFFF"
    link-color: "#2B6F80"
    link-hover-color: "#1F5461"
    link-color-dark: "#7FC3D3"
    link-hover-color-dark: "#A8D8E3"
    navbar-bg: "#2C2C2A"
    navbar-fg: "#F5F0E8"
    headings-color: "#2C2C2A"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

# The default "links" component adds "View on CRAN" whenever CRAN has a
# package called spi. The CRAN package of that name is unrelated, so list
# the links by hand.
home:
  sidebar:
    structure: [source, license, community, citation, authors, dev]
    components:
      source:
        title: Links
        text: |
          [Browse source code](https://github.com/truenomad/spi)

          [Report a bug](https://github.com/truenomad/spi/issues)

          [polished: prepare POLIS data](https://truenomad.github.io/polished/)

navbar:
  bg: primary
  structure:
    left: [home, intro, articles, reference, news]
    right: [search, lightswitch, github]
  components:
    home:
      icon: fa-house
      href: index.html
      aria-label: Home
    articles:
      text: Articles
      menu:
      - text: Using SPI
      - text: Getting started
        href: articles/spi-getting-started.html
      - text: Preparing data
        href: articles/spi-data-preparation.html
      - text: Using SPI with POLIS data
        href: articles/spi-polis.html
      - text: Interpreting SPI
        href: articles/spi-interpretation.html
      - text: How SPI works
        href: articles/spi-methods.html
      - text: -------
      - text: Simple SPI
      - text: Calculating the simple SPI
        href: articles/spi-simple.html
      - text: -------
      - text: Model-based SPI
      - text: Calculating the model-based SPI
        href: articles/spi-model.html
      - text: Model options and sensitivity
        href: articles/spi-model-options.html
      - text: Using SPI for district review
        href: articles/spi-field-guide.html

reference:
- title: Check the inputs
  desc: >
    Check case counts, population estimates and, for the model-based SPI,
    district boundaries. Use `method = "simple"` for the simple SPI table.
  contents:
  - spi_check_inputs
- title: Calculate the simple SPI
  desc: >
    Calculate annual SPI from earlier case counts and population estimates,
    and inspect the calculation for one district.
  contents:
  - spi_simple
  - spi_simple_explain
- title: Calculate the model-based SPI
  desc: >
    Fit expected monthly counts with INLA and calculate annual or monthly SPI,
    with each year's expected counts estimated from preceding years only.
    Pass district boundaries directly, or inspect the neighbour graph
    separately. `spi_compare_overdispersion()` compares the three models for
    count variation.
  contents:
  - spi_adjacency
  - spi_expected
  - spi_index
  - spi_compare_overdispersion
- title: Compare with the NPAFP target
  desc: >
    Compare simple or model-based SPI with the conventional NPAFP target and
    map the result.
  contents:
  - spi_compare_npafp
  - spi_compare_npafp_maps
- title: Review districts
  desc: >
    Organise district review with the five STEPS components, then produce a
    table or a one-page district report.
  contents:
  - spi_field_guide
  - spi_field_guide_table
  - spi_field_guide_pager
  - spi_field_guide_help
- title: Example data
  desc: >
    Synthetic surveillance data for the fictional country Harad, used in the
    examples and articles.
  contents:
  - synth_surveillance
  - synth_field_guide
- title: Methods
  desc: >
    Convert package results to tibbles.
  contents:
  - as_tibble

articles:
- title: Using SPI
  navbar: ~
  contents:
  - spi-getting-started
  - spi-data-preparation
  - spi-polis
  - spi-interpretation
  - spi-methods
- title: Simple SPI
  contents:
  - spi-simple
- title: Model-based SPI
  contents:
  - spi-model
  - spi-model-options
  - spi-field-guide
